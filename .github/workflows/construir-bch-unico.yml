name: Construir manual único definitivo de Biología
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/construir-bch-unico.yml'
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar dependencias
        run: pip install pypdf reportlab
      - name: Crear manual único con portada e índice
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          from reportlab.pdfgen import canvas
          from reportlab.lib.pagesizes import A4
          from reportlab.lib.units import mm
          from pypdf import PdfReader, PdfWriter

          topics = [
          (1,"Visión global de la célula",4),(2,"Organización de la membrana plasmática",7),
          (3,"Intercambios entre la célula y el medio externo",11),(4,"Adhesión celular",15),
          (5,"Señalización celular",20),(6,"Citoesqueleto I. Filamentos de actina",24),
          (7,"Citoesqueleto II-III. Filamentos intermedios y microtúbulos",27),
          (8,"Citosol y ribosomas",30),(9,"Retículo endoplásmico",33),
          (10,"Aparato de Golgi y lisosomas",36),(11,"Mitocondrias y peroxisomas",40),
          (12,"Núcleo interfásico",45),(13,"Ciclo celular",49),
          (14,"División celular I. Mitosis y citocinesis",53),(15,"División celular II. Meiosis",57),
          (16,"Diferenciación celular",58),(17,"Tejido epitelial",61),(18,"Epitelios glandulares",65),
          (19,"Tejido conjuntivo",68),(20,"Tejido adiposo",71),(21,"Tejido cartilaginoso",73),
          (22,"Tejido óseo",76),(23,"Osteogénesis",80),(24,"Sangre",83),(25,"Hematopoyesis",87),
          (26,"Bases celulares de la respuesta inmune",89),(27,"Músculo esquelético",93),
          (28,"Músculo cardiaco y músculo liso",97),(29,"Neurona y microglía central",100),
          (30,"Sinapsis, fibras nerviosas y glía periférica",103)
          ]

          front="bch-frontmatter.pdf"
          c=canvas.Canvas(front,pagesize=A4)
          W,H=A4

          # Portada
          c.setFont("Helvetica-Bold",24)
          c.drawCentredString(W/2,H-70*mm,"APRUEBA MEDICINA")
          c.setFont("Helvetica-Bold",19)
          c.drawCentredString(W/2,H-92*mm,"Biología Celular e Histología Humana")
          c.setFont("Helvetica",12)
          c.drawCentredString(W/2,H-108*mm,"1.º de Medicina · Universidad de Oviedo")
          c.setFont("Helvetica",10)
          c.drawCentredString(W/2,28*mm,"Manual único de estudio")
          c.showPage()

          # Índice 1
          c.setFont("Helvetica-Bold",18); c.drawString(24*mm,H-28*mm,"Índice")
          y=H-42*mm
          c.setFont("Helvetica",10.5)
          for n,title,p in topics[:15]:
              c.drawString(24*mm,y,f"{n:02d}  {title}")
              c.drawRightString(W-24*mm,y,str(p))
              y-=10*mm
          c.showPage()

          # Índice 2
          c.setFont("Helvetica-Bold",18); c.drawString(24*mm,H-28*mm,"Índice · continuación")
          y=H-42*mm
          c.setFont("Helvetica",10.5)
          for n,title,p in topics[15:]:
              c.drawString(24*mm,y,f"{n:02d}  {title}")
              c.drawRightString(W-24*mm,y,str(p))
              y-=10*mm
          c.showPage()
          c.save()

          w=PdfWriter()
          for page in PdfReader(front).pages:
              w.add_page(page)
          for n in range(1,31):
              p=Path(f"bch-tema-{n:02d}.pdf")
              if not p.exists():
                  raise SystemExit(f"Falta {p}")
              for page in PdfReader(str(p)).pages:
                  w.add_page(page)
          with open("bch-completo.pdf","wb") as f:
              w.write(f)

          r=PdfReader("bch-completo.pdf")
          assert len(r.pages)==106, f"Se esperaban 106 páginas y hay {len(r.pages)}"
          print("Manual final:",len(r.pages),"páginas")
          PY
      - name: Publicar
        shell: bash
        run: |
          set -euo pipefail
          rm -f bch-frontmatter.pdf
          rm -f .github/workflows/construir-bch-unico.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bch-completo.pdf .github/workflows/construir-bch-unico.yml
          git commit -m "Publicar manual único definitivo de Biología"
          git push
