name: "Integrar Fisiologia I v2"
"on":
  push:
    paths:
      - ".github/workflows/integrate-fisiologia-v2.yml"
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch app
        run: python scripts/integrate_fisiologia.py
      - name: Validate
        run: |
          grep -q "Fisiología I" app.html
          grep -q "loadFisiologiaBank" app.html
          grep -q "Test global de 100" app.html
          grep -q "Versión 1.0.35" app.html
          test -f data/fisio.parts/part_13.txt
      - name: Commit
        run: |
          git config user.name "Aprueba Medicina"
          git config user.email "actions@users.noreply.github.com"
          git add app.html
          git commit -m "Integra Fisiología I · versión 1.0.35"
          git push origin main
