name: Integrar Fisiología I
on:
  push:
    paths:
      - '.github/workflows/integrate-fisiologia.yml'
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Actualizar app.html
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('app.html')
          s=p.read_text(encoding='utf-8')
          def rep(old,new,label,all=False):
              global s
              if old not in s:
                  raise SystemExit(f'No se encontró el bloque: {label}')
              s=s.replace(old,new) if all else s.replace(old,new,1)

          rep(" {id:'fisiologia',name:'Fisiología General',code:'FIS',desc:'Bases funcionales del organismo humano y su regulación.',active:false},",
              " {id:'fisiologia',name:'Fisiología I',code:'FIS',desc:'17 temas revisados: fisiología general, sentidos, sistema motor, sistema autónomo y funciones superiores.',active:true},",
              'asignatura fisiología')

          rep('Versión 1.0.34','Versión 1.0.35','versión')

          rep("  if(t?.subject==='introduccion'){\n    const loc=String(q?.source_locator||'').trim();\n    if(loc&&/Manual Aprueba Medicina HICS/i.test(loc)) return `Fuente: ${loc}`;\n    return `Fuente: Manual Aprueba Medicina · HICS · ${esc(t.title)} · páginas ${t.page_start}–${t.page_end}`;\n  }",
              "  if(t?.subject==='introduccion'){\n    const loc=String(q?.source_locator||'').trim();\n    if(loc&&/Manual Aprueba Medicina HICS/i.test(loc)) return `Fuente: ${loc}`;\n    return `Fuente: Manual Aprueba Medicina · HICS · ${esc(t.title)} · páginas ${t.page_start}–${t.page_end}`;\n  }\n  if(t?.subject==='fisiologia'){\n    const loc=String(q?.source_locator||'').trim();\n    if(loc) return `Fuente: ${loc}`;\n    return `Fuente: Manual Aprueba Medicina · Fisiología I · ${esc(t.title)} · páginas ${t.page_start}–${t.page_end}`;\n  }",
              'fuente fisiología')

          loader="""async function loadFisiologiaBank(){
 try{
   const parts=await Promise.all(Array.from({length:13},(_,i)=>fetch(`data/fisio.parts/part_${String(i+1).padStart(2,'0')}.txt`).then(r=>{if(!r.ok)throw new Error('Parte '+(i+1));return r.text()})));
   const b64=parts.join('').trim();
   const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
   if(typeof DecompressionStream==='undefined') throw new Error('El navegador no admite descompresión gzip');
   const stream=new Blob([bin]).stream().pipeThrough(new DecompressionStream('gzip'));
   const local=JSON.parse(await new Response(stream).text());
   const existing=new Set(bank.map(q=>q.external_key||('qb-'+q.id)));
   bank.push(...local.filter(q=>!existing.has(q.external_key||('qb-'+q.id))));
 }catch(e){console.error('No se pudo cargar el banco de Fisiología',e)}
}
"""
          rep('async function loadData(){',loader+'async function loadData(){','loader fisiología')
          rep(" if(tp.error) throw tp.error; topics=tp.data||[];bank=qb||[];\n $('#topicCount').textContent=topics.length;$('#questionCount').textContent=bank.length;renderHome();renderTests();",
              " if(tp.error) throw tp.error; topics=tp.data||[];bank=qb||[];await loadFisiologiaBank();\n $('#topicCount').textContent=topics.length;$('#questionCount').textContent=bank.length;renderHome();renderTests();",
              'carga banco fisiología')

          rep('<option value="epidemiologia">Epidemiología</option><option value="introduccion">HICS</option><option value="genetica">Genética</option></select><select id="testCount">',
              '<option value="epidemiologia">Epidemiología</option><option value="fisiologia">Fisiología I</option><option value="introduccion">HICS</option><option value="genetica">Genética</option></select><select id="testCount">',
              'selector tests')

          s=s.replace("${t.subject==='epidemiologia'?'Manual':'PDF'}","${t.subject==='epidemiologia'?'Manual':t.subject==='fisiologia'?'Apuntes revisados':'PDF'}")
          s=s.replace("${t.subject==='epidemiologia'?'Consultar manual':'Consultar PDF'}","${t.subject==='epidemiologia'?'Consultar manual':t.subject==='fisiologia'?'Ver apuntes revisados':'Consultar PDF'}")

          rep("function openPdf(id){const t=topics.find(x=>x.id===id);if(!t)return;if(t.subject==='epidemiologia')",
              "function openPdf(id){const t=topics.find(x=>x.id===id);if(!t)return;if(t.subject==='fisiologia'){openSummary(t.id);return}if(t.subject==='epidemiologia')",
              'apertura fisiología')

          rep('function questionSourceTarget(q,t){',
              "function questionSourceTarget(q,t){if(t?.subject==='fisiologia'){const start=Math.max(1,Number(t?.page_start)||1),end=Math.max(start,Number(t?.page_end)||start);return{page:start,label:`Manual Aprueba Medicina · Fisiología I · páginas ${start}–${end}`}}",
              'fuente pregunta fisiología')

          rep("async function openQuestionSource(q){const t=topics.find(x=>x.id===q.topic_id);if(!t){alert('Esta pregunta todavía no tiene un apartado del temario asignado.');return}const target=questionSourceTarget(q,t),button=$('#openQuestionSource');if(t.subject==='epidemiologia')",
              "async function openQuestionSource(q){const t=topics.find(x=>x.id===q.topic_id);if(!t){alert('Esta pregunta todavía no tiene un apartado del temario asignado.');return}const target=questionSourceTarget(q,t),button=$('#openQuestionSource');if(t.subject==='fisiologia'){openSummary(t.id);return}if(t.subject==='epidemiologia')",
              'abrir fuente pregunta fisiología')

          rep("function startGlobal(subject,count){const all=bank.filter(q=>q.subject===subject&&q.use_in_global!==false);const n=Math.max(50,Number(count||50));",
              "function startGlobal(subject,count){const all=bank.filter(q=>q.subject===subject&&q.use_in_global!==false);const n=subject==='fisiologia'?100:Math.max(50,Number(count||50));",
              'test global 100')

          rep("$('#globalTest').textContent=hasGlobal?'Test global de 50':globalCount?`Test global en preparación (${globalCount}/50)`:'Test global próximamente'",
              "$('#globalTest').textContent=hasGlobal?(s==='fisiologia'?'Test global de 100':'Test global de 50'):globalCount?`Test global en preparación (${globalCount}/50)`:'Test global próximamente'",
              'etiqueta test global')

          rep("<p>${ts.length} temas · ${bank.filter(q=>q.subject===id&&(id!=='histologia'||q.use_in_topic!==false||q.use_in_global!==false)).length} preguntas disponibles</p>",
              "<p>${ts.length} temas · ${bank.filter(q=>q.subject===id&&(id!=='histologia'||q.use_in_topic!==false||q.use_in_global!==false)).length} preguntas disponibles</p>${id==='fisiologia'?'<p class=\"source\">Programa UNIOVI 2026-2027 · 17 temas revisados · banco de 850 preguntas · test global de 100.</p>':''}",
              'info fisiología')

          # Selectores de administración: importación y filtro del banco.
          s=s.replace('<option value="epidemiologia">Epidemiología</option><option value="introduccion">HICS</option><option value="genetica">Genética</option></select></label><label>Archivo JSON',
                      '<option value="epidemiologia">Epidemiología</option><option value="fisiologia">Fisiología I</option><option value="introduccion">HICS</option><option value="genetica">Genética</option></select></label><label>Archivo JSON')
          s=s.replace('<option value="epidemiologia">Epidemiología</option><option value="introduccion">HICS</option><option value="genetica">Genética</option></select></label><label>Tema',
                      '<option value="epidemiologia">Epidemiología</option><option value="fisiologia">Fisiología I</option><option value="introduccion">HICS</option><option value="genetica">Genética</option></select></label><label>Tema')

          # Mostrar claramente que las preguntas estáticas de Fisiología no deben editarse como filas DB.
          rep("<button data-question-edit=\"${q.id}\">Editar</button><button data-question-copy=\"${q.id}\">Duplicar</button><button class=\"danger\" data-question-delete=\"${q.id}\">Eliminar</button>",
              "${q.subject==='fisiologia'?'<span class=\"source\">Banco validado integrado</span>':`<button data-question-edit=\"${q.id}\">Editar</button><button data-question-copy=\"${q.id}\">Duplicar</button><button class=\"danger\" data-question-delete=\"${q.id}\">Eliminar</button>`}",
              'admin preguntas fisiología')

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validación mínima
        run: |
          grep -q "Fisiología I" app.html
          grep -q "loadFisiologiaBank" app.html
          grep -q "Test global de 100" app.html
          grep -q "Versión 1.0.35" app.html
          test -f data/fisio.parts/part_13.txt
      - name: Publicar integración y retirar workflow temporal
        run: |
          git config user.name "Aprueba Medicina"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/integrate-fisiologia.yml
          git add -A
          git commit -m "Integra Fisiología I · versión 1.0.35"
          git push origin main
