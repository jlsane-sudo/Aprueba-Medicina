name: Aplicar soporte de manual Fisiología

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-fisio-admin-patch.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Aplicar parche
        run: python scripts/patch_fisio_manual_admin.py
      - name: Guardar cambio
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.html
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "Habilita carga privada del manual de Fisiología"
            git push
          fi
