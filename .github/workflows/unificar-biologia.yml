name: Unificar manual de Biología
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/unificar-biologia.yml'
permissions:
  contents: write

jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar pypdf
        run: pip install pypdf
      - name: Unificar los 30 temas
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p backups
          if [ -f bch-completo.pdf ]; then
            cp bch-completo.pdf backups/bch-completo-pre-unificacion-2026-09-29.pdf
          fi
          python - <<'PY'
          from pypdf import PdfReader, PdfWriter
          from pathlib import Path
          w=PdfWriter()
          for n in range(1,31):
              p=Path(f"bch-tema-{n:02d}.pdf")
              if not p.exists():
                  raise SystemExit(f"Falta {p}")
              r=PdfReader(str(p))
              for page in r.pages:
                  w.add_page(page)
          with open("bch-completo.pdf","wb") as f:
              w.write(f)
          r=PdfReader("bch-completo.pdf")
          print("Páginas:", len(r.pages))
          assert len(r.pages)==103, f"Se esperaban 103 páginas y hay {len(r.pages)}"
          PY
      - name: Publicar manual único
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/unificar-biologia.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bch-completo.pdf backups/bch-completo-pre-unificacion-2026-09-29.pdf .github/workflows/unificar-biologia.yml
          git commit -m "Unificar Biología en un único manual"
          git push
